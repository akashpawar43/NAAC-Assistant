# Production-style deploy on one small VM (Oracle Cloud Free ARM or Hetzner CX22).
#   cp .env.example .env   # set PUBLIC_URL, SMTP_*, POSTGRES_PASSWORD
#   docker compose up -d --build
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: naac
      POSTGRES_USER: naac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naac"]
      interval: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://naac:${POSTGRES_PASSWORD}@db:5432/naac
      FILES_DIR: /data/files
    volumes:
      - files:/data/files

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app]

  # Daily database backup kept for 14 days (copy ./backups off the server, e.g. to R2).
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do pg_dump -h db -U naac -Fc naac > /backups/naac_$$(date +%F).dump;
             find /backups -name "*.dump" -mtime +14 -delete; sleep 86400; done'

volumes:
  pgdata:
  files:
  caddy:
